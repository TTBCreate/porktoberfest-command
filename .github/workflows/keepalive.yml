name: Keep schedule alive

# GitHub turns off scheduled workflows in public repos after 60 days with no commits.
# This makes one tiny commit a month so the monitor keeps running through March 2027.
on:
  schedule:
    - cron: '17 15 1 * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  heartbeat:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: |
          date -u +"%Y-%m-%dT%H:%M:%SZ" > .github/heartbeat
          git config user.name "porktoberfest-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .github/heartbeat
          git commit -m "Monthly heartbeat" || echo "No change"
          git push
