name: Hogs monitor

# GitHub schedules run in UTC. 13:40 / 22:40 UTC = 7:40 am / 4:40 pm Central Standard Time.
# After daylight saving starts (Mar 14, 2027) they run an hour later in local time: 8:40 am / 5:40 pm CDT.
on:
  schedule:
    - cron: '40 13 * * *'
    - cron: '40 22 * * *'
  workflow_dispatch:
    inputs:
      mode:
        description: 'What to run'
        type: choice
        default: check
        options: [check, daily, trends, brief, test]

concurrency:
  group: hogs-monitor
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: monitor
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: monitor/package-lock.json
      - run: npm ci --no-audit --no-fund
      - run: node index.js ${{ github.event.inputs.mode || 'auto' }}
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
          GMAIL_USER: ${{ secrets.GMAIL_USER }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          ALERT_EMAIL_TO: ${{ secrets.ALERT_EMAIL_TO }}
          IG_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}
          IG_USER_ID: ${{ secrets.IG_USER_ID }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
